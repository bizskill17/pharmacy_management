name: Deploy to Hostinger

on:
  push:
    branches: [php-app]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          for name in DB_NAME DB_USER DB_PASSWORD ADMIN_PHONE ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret in GitHub before deploying. Nothing was uploaded."
              exit 1
            fi
          done

      - name: Create server configuration
        run: |
          php -r '
            $config = [
              "db_host" => "localhost",
              "db_name" => getenv("DB_NAME"),
              "db_user" => getenv("DB_USER"),
              "db_pass" => getenv("DB_PASSWORD"),
              "admin_name" => "Admin",
              "admin_phone" => getenv("ADMIN_PHONE"),
              "admin_password" => getenv("ADMIN_PASSWORD"),
            ];
            file_put_contents("site/app/config.local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '
          php -l site/app/config.local.php

      - name: Upload by FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          timeout: 120000
          local-dir: ./site/
          # This FTP account opens directly inside the site's public_html folder.
          server-dir: ./

      - name: Wait before retrying
        if: steps.ftp1.outcome == 'failure'
        run: sleep 30

      - name: Retry upload
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          timeout: 120000
          local-dir: ./site/
          # This FTP account opens directly inside the site's public_html folder.
          server-dir: ./

      - name: Wait before final retry
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 60

      - name: Final upload attempt
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          timeout: 120000
          local-dir: ./site/
          # This FTP account opens directly inside the site's public_html folder.
          server-dir: ./
